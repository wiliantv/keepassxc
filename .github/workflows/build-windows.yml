name: Build Windows

on:
  push:
    branches:
      - 'develop'
      - 'main'
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}/vcpkg/archives
            build/vcpkg_installed
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DWITH_XC_ALL=ON `
            -DKPXC_FEATURE_GOOGLE_DRIVE=ON `
            -DKPXC_FEATURE_DOCS=OFF `
            -DWITH_TESTS=OFF

      - name: Build KeePassXC
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Package KeePassXC (Install and Deploy)
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist

          # Ensure all vcpkg runtime DLLs are copied
          if (Test-Path "build/vcpkg_installed/x64-windows/bin") {
            Copy-Item -Path "build/vcpkg_installed/x64-windows/bin/*.dll" -Destination "dist" -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path "build/src/Release") {
            Copy-Item -Path "build/src/Release/*.dll" -Destination "dist" -Force -ErrorAction SilentlyContinue
          }

          Compress-Archive -Path "dist/*" -DestinationPath "keepassxc-windows-x86_64.zip"

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keepassxc-windows-x86_64
          path: keepassxc-windows-x86_64.zip
          retention-days: 14
